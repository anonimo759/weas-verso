<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Weas-Verso</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        justify-content: center;
        align-items: center;

        text-align: center;
    }

    .box {
        width: 90%;
        max-width: 420px;

        background: #1d1d1d;
        padding: 30px;

        border-radius: 18px;

        box-shadow: 0 0 25px rgba(0,0,0,0.7);
    }

    h1 {
        margin-top: 0;
    }

    input,
    button {
        width: 100%;
        padding: 13px;
        margin-top: 10px;

        border: none;
        border-radius: 9px;

        font-size: 16px;
    }

    input {
        background: #292929;
        color: white;
        outline: none;
    }

    button {
        background: #5865f2;
        color: white;

        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        background: #4752c4;
    }

    #noAdmin {
        display: none;
        background: #444;
    }

    #noAdmin:hover {
        background: #555;
    }

    #game,
    #adminPanel {
        display: none;
    }

    #error {
        color: #ff5555;
        min-height: 20px;
    }

    .stats {
        background: #292929;
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
    }
</style>
</head>

<body>


<!-- ========================= -->
<!-- PANTALLA DE ADMIN -->
<!-- ========================= -->

<div class="box" id="login">

    <h1>🔐 Acceso</h1>

    <p>¿Eres administrador?</p>

    <input
        type="password"
        id="password"
        placeholder="Contraseña"
    >

    <button onclick="entrarAdmin()">
        🔑 ENTRAR COMO ADMIN
    </button>

    <!-- Aparece después de 2 segundos -->
    <button id="noAdmin" onclick="entrarJugador()">
        👤 NO SOY ADMIN
    </button>

    <p id="error"></p>

</div>


<!-- ========================= -->
<!-- PANEL ADMIN -->
<!-- ========================= -->

<div class="box" id="adminPanel">

    <h1>👑 PANEL DE ADMIN</h1>

    <p>Bienvenido, administrador 😎</p>

    <div class="stats">
        <h3>📊 Información</h3>

        <p id="adminInfo">
            Panel funcionando correctamente.
        </p>
    </div>

    <button onclick="volver()">
        🚪 SALIR
    </button>

</div>


<!-- ========================= -->
<!-- JUEGO NORMAL -->
<!-- ========================= -->

<div class="box" id="game">

    <h1>🗿 WEAS-VERSO</h1>

    <p>Bienvenido al Weas-Verso 💀</p>

    <input
        type="text"
        id="playerName"
        placeholder="Escribe tu nombre"
    >

    <button onclick="entrarJuego()">
        ▶️ ENTRAR
    </button>

    <div id="menuJuego" style="display:none;">

        <h2 id="bienvenida"></h2>

        <button onclick="eventoRandom()">
            🎲 EVENTO RANDOM
        </button>

        <button onclick="mostrarStats()">
            📊 MIS STATS
        </button>

        <button onclick="salirJuego()">
            🚪 SALIR
        </button>

        <p id="resultado"></p>

    </div>

</div>


<script>

/* ================================= */
/* CONFIGURACIÓN */
/* ================================= */

const PASSWORD_ADMIN = "1234";


/* ================================= */
/* MOSTRAR "NO SOY ADMIN" */
/* ================================= */

setTimeout(() => {

    document.getElementById("noAdmin").style.display = "block";

}, 2000);


/* ================================= */
/* ENTRAR COMO ADMIN */
/* ================================= */

function entrarAdmin() {

    const password =
        document.getElementById("password").value;

    const error =
        document.getElementById("error");


    if (password === PASSWORD_ADMIN) {

        document.getElementById("login").style.display = "none";

        document.getElementById("adminPanel").style.display = "block";

        error.textContent = "";

    } else {

        error.textContent =
            "❌ Contraseña incorrecta";

    }

}


/* ================================= */
/* NO SOY ADMIN */
/* ================================= */

function entrarJugador() {

    document.getElementById("login").style.display = "none";

    document.getElementById("game").style.display = "block";

}


/* ================================= */
/* ENTRAR AL JUEGO */
/* ================================= */

function entrarJuego() {

    const nombre =
        document.getElementById("playerName").value.trim();

    if (nombre === "") {

        alert("⚠️ Escribe un nombre primero");

        return;
    }


    document.getElementById("playerName").style.display = "none";

    document.querySelector("#game > button").style.display = "none";

    document.getElementById("menuJuego").style.display = "block";

    document.getElementById("bienvenida").textContent =
        "Hola, " + nombre + " 😎";


    /* Guardar jugador localmente */

    let jugadores =
        JSON.parse(localStorage.getItem("jugadores")) || [];


    jugadores.push({

        nombre: nombre,

        fecha: new Date().toLocaleString()

    });


    localStorage.setItem(
        "jugadores",
        JSON.stringify(jugadores)
    );

}


/* ================================= */
/* EVENTO RANDOM */
/* ================================= */

function eventoRandom() {

    const eventos = [

        "💀 Te cayó un piano del cielo",

        "🗿 Encontraste una papa legendaria",

        "🚀 Te fuiste a otra dimensión",

        "🐔 Una gallina te declaró la guerra",

        "💰 Encontraste 999999 monedas",

        "🌋 EL VOLCÁN SE ACTIVÓ",

        "🧠 Ganaste +100 IQ",

        "☠️ Te tropezaste con una piedra"

    ];


    const random =
        Math.floor(Math.random() * eventos.length);


    document.getElementById("resultado").textContent =
        eventos[random];

}


/* ================================= */
/* STATS */
/* ================================= */

function mostrarStats() {

    const jugadores =
        JSON.parse(localStorage.getItem("jugadores")) || [];

    alert(
        "👥 Jugadores registrados en este dispositivo: "
        + jugadores.length
    );

}


/* ================================= */
/* SALIR DEL JUEGO */
/* ================================= */

function salirJuego() {

    location.reload();

}


/* ================================= */
/* VOLVER */
/* ================================= */

function volver() {

    location.reload();

}

</script>

</body>
</html>
