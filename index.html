<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>💀 WEAS-VERSO 💀</title>

    <link rel="stylesheet"
          href="https://pyscript.net/releases/2024.1.1/core.css">

    <script type="module"
            src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            background: #121212;
            color: #00ff00;
            font-family: monospace;
            padding: 20px;
        }

        h1 {
            text-shadow: 0 0 10px #00ff00;
        }

        button, input {
            background: #222;
            color: #00ff00;
            border: 1px solid #00ff00;
            padding: 12px;
            margin: 5px;
            font-family: monospace;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        button:hover {
            background: #00ff00;
            color: #000;
        }

        #pantalla {
            background: #050505;
            border: 1px solid #00ff00;
            padding: 15px;
            margin-top: 20px;
            min-height: 250px;
            white-space: pre-wrap;
            box-shadow: 0 0 10px #00ff0033;
        }

        #juego {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<h1>💀 WEAS-VERSO 💀</h1>

<p>👤 Nombre del jugador:</p>

<input id="nombre"
       type="text"
       placeholder="Escribe tu nombre">

<button id="iniciar">
    🚀 INICIAR
</button>

<div id="juego" style="display: none;">

    <h2>📟 MENÚ PRINCIPAL</h2>

    <button id="evento">
        🎲 Evento random
    </button>

    <button id="hack">
        💻 Hack falso
    </button>

    <button id="stats">
        ❤️ Estadísticas
    </button>

    <button id="salir">
        🚪 Salir
    </button>

</div>

<div id="pantalla">
    💀 WEAS-VERSO esperando jugador...
</div>


<script type="py">

from pyscript import document, when
import random

# =========================
# VARIABLES DEL JUEGO
# =========================

vida = 100
puntos = 0
jugando = False
nombre = ""


# =========================
# FUNCIÓN PARA ESCRIBIR
# =========================

def escribir(texto):
    pantalla = document.querySelector("#pantalla")
    pantalla.innerText = texto


# =========================
# INICIAR JUEGO
# =========================

@when("click", "#iniciar")
def iniciar(event):

    global nombre
    global jugando
    global vida
    global puntos

    nombre = document.querySelector("#nombre").value.strip()

    if nombre == "":
        escribir("❌ WN, pon tu nombre primero 💀")
        return

    vida = 100
    puntos = 0
    jugando = True

    document.querySelector("#juego").style.display = "block"

    escribir(
        "╔════════════════════════════╗\n"
        "║       💀 WEAS-VERSO 💀     ║\n"
        "║       SYSTEM ONLINE        ║\n"
        "╚════════════════════════════╝\n\n"
        f"🧠 Bienvenido, {nombre}.\n\n"
        "📟 El sistema te está observando...\n"
        "💀 Buena suerte, la vas a necesitar."
    )


# =========================
# EVENTO RANDOM
# =========================

@when("click", "#evento")
def evento_random(event):

    global puntos

    if not jugando:
        return

    evento = random.choice([
        "👁️ Una entidad te está mirando.",
        "💀 Apareció un weón.",
        "🍫 Encontraste un chocolate.",
        "🗿 No pasó absolutamente nada.",
        "🐀 Una rata te cobra impuestos.",
        "📡 El FBI te mandó un sticker.",
        "🗿 El sistema decidió ignorarte.",
        "📱 Encontraste una app.",
        "🦆 Un pato te juzgó.",
        "💻 El PC hizo Windows XP noises.",
        "🌚 Miraste al vacío y el vacío te miró de vuelta."
    ])

    ganancia = random.randint(1, 20)

    puntos += ganancia

    escribir(
        "🎲 EVENTO RANDOM\n\n"
        f"{evento}\n\n"
        f"⭐ +{ganancia} puntos\n"
        f"⭐ Puntos totales: {puntos}"
    )


# =========================
# HACK FALSO
# =========================

@when("click", "#hack")
def hack(event):

    if not jugando:
        return

    escribir(
        "🕵️ INICIANDO HACK...\n\n"
        "📡 Conectando...\n"
        "💻 Accediendo al mainframe...\n"
        "🔓 Contraseña encontrada: 1234\n"
        "📡 IP FALSA: 192.168.69.420\n\n"
        "💀 FELICIDADES.\n"
        "HICISTE ABSOLUTAMENTE NADA."
    )


# =========================
# ESTADÍSTICAS
# =========================

@when("click", "#stats")
def stats(event):

    if not jugando:
        return

    escribir(
        "📊 ESTADÍSTICAS\n\n"
        f"👤 Jugador: {nombre}\n"
        f"❤️ Vida: {vida}\n"
        f"⭐ Puntos: {puntos}\n"
        "🎮 Estado: JUGANDO"
    )


# =========================
# SALIR
# =========================

@when("click", "#salir")
def salir(event):

    global jugando

    jugando = False

    document.querySelector("#juego").style.display = "none"

    escribir(
        "🚪 SESIÓN TERMINADA\n\n"
        "📟 No puedes escapar...\n"
        "💀 El Weas-Verso te observa.\n\n"
        "👁️ Hasta la próxima, weón."
    )

</script>

</body>
</html>
